name: Deploy docs site
description: Publish the latest dbt docs, docglow, dbt-colibri and Elementary reports to the tenant-only docs site (dbt-docs-<env>)
# Needs an earlier `azure/login` step. The identity needs Storage Blob Data Reader on the
# storage account and Website Contributor on the web app (infra: deploy_docs_sites = ["dbt"]).
# The site is rebuilt from ADLS, not from this run's artifacts, so a report this run
# didn't produce keeps its last version instead of disappearing from the site.

inputs:
  storage-account:
    description: Storage account holding <container>/docs/, e.g. fountainprodstorage
    required: true
  container:
    description: Container the docs were uploaded to
    required: false
    default: dbt
  web-app:
    description: Docs site web app, e.g. dbt-docs-prod
    required: true
  resource-group:
    description: Its resource group, e.g. rg-dbt-docs-production
    required: true
  dbt-target:
    description: staging or production (shown on the landing page)
    required: true

runs:
  using: "composite"
  steps:
    - name: Build site from ${{ inputs.storage-account }}/${{ inputs.container }}/docs
      shell: bash
      run: |
        # docs/{dbt,docglow,colibri,elementary}/... → site/{dbt,docglow,colibri,elementary}/...
        mkdir -p "$RUNNER_TEMP/download" "$RUNNER_TEMP/site"
        az storage blob download-batch \
          --account-name "${{ inputs.storage-account }}" \
          --source "${{ inputs.container }}" \
          --pattern 'docs/*' \
          --destination "$RUNNER_TEMP/download" \
          --auth-mode login \
          --only-show-errors > /dev/null
        cp -R "$RUNNER_TEMP/download/docs/." "$RUNNER_TEMP/site/"

        # Landing page linking each report.
        sed -e "s|__TARGET__|${{ inputs.dbt-target }}|g" \
            -e "s|__UPDATED__|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
            -e "s|__RUN_URL__|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|g" \
            "${{ github.action_path }}/index.html" > "$RUNNER_TEMP/site/index.html"

        (cd "$RUNNER_TEMP/site" && zip -qr "$RUNNER_TEMP/site.zip" .)

    - name: Deploy to ${{ inputs.web-app }}
      shell: bash
      run: |
        # --clean: the zip replaces the whole site.
        az webapp deploy \
          --resource-group "${{ inputs.resource-group }}" \
          --name "${{ inputs.web-app }}" \
          --src-path "$RUNNER_TEMP/site.zip" \
          --type zip \
          --clean true \
          --only-show-errors > /dev/null

        url="https://${{ inputs.web-app }}.azurewebsites.net"
        echo "### Docs site: $url" >> "$GITHUB_STEP_SUMMARY"
        (cd "$RUNNER_TEMP/site" && find . -type f | sort | sed 's|^\./|- |') >> "$GITHUB_STEP_SUMMARY"
