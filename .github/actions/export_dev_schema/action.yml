name: Export dev schema
description: Export dev schema name to github environment
runs:
  using: "composite"
  steps:
    - name: Setup dev schema
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            DEV_BRANCH=${{ github.head_ref }}
            pr_schema="pr_${DEV_BRANCH//["/". "-". "."]/"_"}"
            echo "DEV_SCHEMA="${pr_schema^^}"" >> $GITHUB_ENV
        fi