name: dbt (reusable)

on:
  workflow_call:
    inputs:
      dbt-target:
        description: dbt target to run against (ci, staging, production)
        required: true
        type: string
      full-run:
        description: Build the whole project (daily run) instead of only modified models
        required: false
        type: boolean
        default: false
      dbt-args:
        description: Extra args passed to dbt build on a full run
        required: false
        type: string
        default: ''

env:
  GITHUB_USERNAME: ${{ github.actor }}

jobs:
  build-databricks:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: ${{ inputs.dbt-target }}
      DBX_ID_APPLICATION_ID: ${{ secrets.DBX_ID_APPLICATION_ID }}
      DBX_SECRET: ${{ secrets.DBX_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activate uv
        uses: ./.github/actions/setup_uv
        with:
          working-directory: cdc_marketing

      - name: CI/CD
        uses: ./.github/actions/dbt_ci_cd
        with:
          project-dir: cdc_marketing
          github-token: ${{ github.token }}
          full-run: ${{ inputs.full-run }}
          dbt-args: ${{ inputs.dbt-args }}

  # Copies this run's GitHub artifacts (manifest + dbt docs, docglow, colibri) to ADLS:
  #   fountain<stg|prod>storage / dbt / manifest/manifest.json   (production only)
  #                                    docs/{dbt,docglow,colibri}/...
  # Staging and production only: ci (PR) runs never log in to Azure.
  # Like the GitHub uploads, it publishes whatever the dbt job produced, even if a
  # later step there failed (e.g. Elementary); a missing artifact is just skipped.
  publish-adls:
    if: ${{ !cancelled() && inputs.dbt-target != 'ci' }}
    needs: build-databricks
    runs-on: ubuntu-latest
    # The GitHub Environment picks this env's AZURE_CLIENT_ID and is what Azure trusts
    # (OIDC subject ...:environment:<target>). Callers must grant `id-token: write`.
    environment: ${{ inputs.dbt-target }}
    env:
      STORAGE_ACCOUNT: fountain${{ inputs.dbt-target == 'production' && 'prod' || 'stg' }}storage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get prod manifest.json
        if: inputs.dbt-target == 'production'
        continue-on-error: true # Not produced this run → nothing to publish.
        uses: actions/download-artifact@v4
        with:
          name: dbt-prod-manifest
          path: adls/manifest

      - name: Get dbt docs
        continue-on-error: true # Not produced this run → nothing to publish.
        uses: actions/download-artifact@v4
        with:
          name: dbt-docs-${{ inputs.dbt-target }}
          path: adls/docs/dbt

      - name: Get docglow docs
        continue-on-error: true # Not produced this run → nothing to publish.
        uses: actions/download-artifact@v4
        with:
          name: docglow-${{ inputs.dbt-target }}
          path: adls/docs/docglow

      - name: Get dbt-colibri report
        continue-on-error: true # Not produced this run → nothing to publish.
        uses: actions/download-artifact@v4
        with:
          name: colibri-${{ inputs.dbt-target }}
          path: adls/docs/colibri

      - name: Azure login (OIDC)
        if: hashFiles('adls/**') != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to ADLS
        if: hashFiles('adls/**') != ''
        uses: ./.github/actions/upload_adls
        with:
          storage-account: ${{ env.STORAGE_ACCOUNT }}
          source-dir: adls
