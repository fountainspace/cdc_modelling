name: dbt (reusable)

on:
  workflow_call:
    inputs:
      dbt-target:
        description: dbt target to run against (ci, staging, production)
        required: true
        type: string
      full-run:
        description: Build the whole project (daily run) instead of only modified models
        required: false
        type: boolean
        default: false
      dbt-args:
        description: Extra args passed to dbt build on a full run
        required: false
        type: string
        default: ''

env:
  GITHUB_USERNAME: ${{ github.actor }}

jobs:
  build-databricks:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: ${{ inputs.dbt-target }}
      DBX_ID_APPLICATION_ID: ${{ secrets.DBX_ID_APPLICATION_ID }}
      DBX_SECRET: ${{ secrets.DBX_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activate uv
        uses: ./.github/actions/setup_uv
        with:
          working-directory: cdc_marketing

      - name: CI/CD
        uses: ./.github/actions/dbt_ci_cd
        with:
          project-dir: cdc_marketing
          github-token: ${{ github.token }}
          full-run: ${{ inputs.full-run }}
          dbt-args: ${{ inputs.dbt-args }}

  # Publishes this run's GitHub artifacts to Azure. Staging and production only:
  # ci (PR) runs never log in to Azure.
  #   manifest (production only) → fountain<stg|prod>storage / dbt / manifest/manifest.json
  #   each report, on its own     → fountain<stg|prod>storage / dbt / docs/<report>/<file>
  #                                 https://dbt-docs-<stg|prod>.azurewebsites.net/<report>/<file>
  # Every report has its own get + publish steps, like its GitHub artifact: a report this
  # run didn't produce is skipped (its last version stays online), and one report failing
  # doesn't stop the others. Like the GitHub uploads, it publishes whatever the dbt job
  # produced, even if a later step there failed (e.g. Elementary).
  publish-adls:
    if: ${{ !cancelled() && inputs.dbt-target != 'ci' }}
    needs: build-databricks
    runs-on: ubuntu-latest
    # The GitHub Environment picks this env's AZURE_CLIENT_ID and is what Azure trusts
    # (OIDC subject ...:environment:<target>). Callers must grant `id-token: write`.
    environment: ${{ inputs.dbt-target }}
    env:
      STORAGE_ACCOUNT: fountain${{ inputs.dbt-target == 'production' && 'prod' || 'stg' }}storage
      DOCS_SITE: dbt-docs-${{ inputs.dbt-target == 'production' && 'prod' || 'stg' }}
      DOCS_RESOURCE_GROUP: rg-dbt-docs-${{ inputs.dbt-target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get prod manifest.json
        if: inputs.dbt-target == 'production'
        continue-on-error: true # Not produced this run → nothing to publish.
        uses: actions/download-artifact@v4
        with:
          name: dbt-prod-manifest
          path: adls/manifest

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload manifest to ADLS
        if: hashFiles('adls/**') != ''
        uses: ./.github/actions/upload_adls
        with:
          storage-account: ${{ env.STORAGE_ACCOUNT }}
          source-dir: adls

      # ---- dbt docs ----
      - name: Get dbt docs
        id: get-dbt
        continue-on-error: true # Not produced this run → nothing to publish.
        uses: actions/download-artifact@v4
        with:
          name: dbt-docs-${{ inputs.dbt-target }}
          path: reports/dbt

      - name: Publish dbt docs
        if: ${{ !cancelled() && steps.get-dbt.outcome == 'success' }}
        uses: ./.github/actions/publish_report
        with:
          file: reports/dbt/static_index.html
          path: dbt/static_index.html
          storage-account: ${{ env.STORAGE_ACCOUNT }}
          web-app: ${{ env.DOCS_SITE }}
          resource-group: ${{ env.DOCS_RESOURCE_GROUP }}

      # ---- docglow ----
      - name: Get docglow docs
        id: get-docglow
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docglow-${{ inputs.dbt-target }}
          path: reports/docglow

      - name: Publish docglow docs
        if: ${{ !cancelled() && steps.get-docglow.outcome == 'success' }}
        uses: ./.github/actions/publish_report
        with:
          file: reports/docglow/index.html
          path: docglow/index.html
          storage-account: ${{ env.STORAGE_ACCOUNT }}
          web-app: ${{ env.DOCS_SITE }}
          resource-group: ${{ env.DOCS_RESOURCE_GROUP }}

      # ---- dbt-colibri ----
      - name: Get dbt-colibri report
        id: get-colibri
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: colibri-${{ inputs.dbt-target }}
          path: reports/colibri

      - name: Publish dbt-colibri report
        if: ${{ !cancelled() && steps.get-colibri.outcome == 'success' }}
        uses: ./.github/actions/publish_report
        with:
          file: reports/colibri/index.html
          path: colibri/index.html
          storage-account: ${{ env.STORAGE_ACCOUNT }}
          web-app: ${{ env.DOCS_SITE }}
          resource-group: ${{ env.DOCS_RESOURCE_GROUP }}

      # ---- Elementary ----
      - name: Get Elementary report
        id: get-elementary
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: elementary-report-${{ inputs.dbt-target }}
          path: reports/elementary

      - name: Publish Elementary report
        if: ${{ !cancelled() && steps.get-elementary.outcome == 'success' }}
        uses: ./.github/actions/publish_report
        with:
          file: reports/elementary/elementary_report.html
          path: elementary/elementary_report.html
          storage-account: ${{ env.STORAGE_ACCOUNT }}
          web-app: ${{ env.DOCS_SITE }}
          resource-group: ${{ env.DOCS_RESOURCE_GROUP }}
