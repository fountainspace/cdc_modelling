name: dbt (reusable)

on:
  workflow_call:
    inputs:
      dbt-target:
        description: dbt target to run against (ci, staging, production)
        required: true
        type: string
      run-lint:
        description: Run sqlfluff diff-quality against main
        required: false
        type: boolean
        default: false
      full-run:
        description: Build the whole project (daily run) instead of only modified models
        required: false
        type: boolean
        default: false
      dbt-args:
        description: Extra args passed to dbt build on a full run
        required: false
        type: string
        default: ''

env:
  GITHUB_USERNAME: ${{ github.actor }}

jobs:
  lint:
    if: inputs.run-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate uv
        uses: ./.github/actions/setup_uv

      - name: Check SQL linting
        run: |
          uv run diff-quality \
            --violations sqlfluff \
            --compare-branch=origin/main \
            --fail-under=100

  build-databricks:
    runs-on: ubuntu-latest
    needs: lint
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    env:
      DBT_TARGET: ${{ inputs.dbt-target }}
      DEV_HTTP_PATH: ${{ vars.DEV_HTTP_PATH }}
      DBX_ID_APPLICATION_ID: ${{ secrets.DBX_ID_APPLICATION_ID }}
      DBX_SECRET: ${{ secrets.DBX_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activate uv
        uses: ./.github/actions/setup_uv

      - name: CI/CD
        uses: ./.github/actions/dbt_ci_cd
        with:
          project-dir: cdc_marketing
          github-token: ${{ github.token }}
          full-run: ${{ inputs.full-run }}
          dbt-args: ${{ inputs.dbt-args }}
