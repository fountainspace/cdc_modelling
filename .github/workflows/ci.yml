name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_dbt.yml
    secrets: inherit
    with:
      dbt-target: ci
      run-lint: true
