name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate uv
        uses: ./.github/actions/setup_uv
        with:
          working-directory: cdc_marketing

      - name: Check SQL linting
        # run from repo root so diff-quality's git paths resolve; sqlfluff picks up cdc_marketing/.sqlfluff
        run: |
          uv run --project cdc_marketing diff-quality \
            --violations sqlfluff \
            --compare-branch=origin/main \
            --fail-under=100

  build:
    needs: lint
    uses: ./.github/workflows/_dbt.yml
    secrets: inherit
    with:
      dbt-target: ci
