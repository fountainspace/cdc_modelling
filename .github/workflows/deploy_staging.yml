name: Deploy to Staging

on:
  pull_request:
    types:
      - labeled
    branches:
      - main

permissions:
  contents: read
  actions: read
  id-token: write # Azure login (OIDC) in _dbt.yml's publish-adls job.

concurrency:
  group: deploy-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.label.name == 'deploy-to-staging'
    uses: ./.github/workflows/_dbt.yml
    secrets: inherit
    with:
      dbt-target: staging
