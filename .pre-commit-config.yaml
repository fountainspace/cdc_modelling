repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        args: ['--maxkb=10800']

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.2
    hooks:
      # Metric View models (metric_view_*.sql) hold a YAML spec, not SQL, so they are
      # unparsable by sqlfluff. They are validated by `dbt parse`/`compile` and
      # excluded here. See docs/metric-views.md.
      - id: sqlfluff-lint
        exclude: '(^|/)metric_view_[^/]*\.sql$'
        additional_dependencies: ['dbt-databricks']
      - id: sqlfluff-fix
        args: ['--FIX-EVEN-UNPARSABLE'] # by default fluff doesn't fix files with PRS or TMP issues this allows it to
        exclude: '(^|/)metric_view_[^/]*\.sql$'
        additional_dependencies: ['dbt-databricks']
