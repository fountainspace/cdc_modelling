
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'cdc_marketing'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'cdc_marketing'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  cdc_marketing:
    # Config indicated by + and applies to all files under models/example/
    staging: 
      +catalog: "{{ 'silver_production' if (target.name == 'production') else 'silver_staging' if (target.name == 'staging') else target.catalog }}"
      +schema: staging

    intermediate:
      +materialized: table
      +catalog: "{{ 'silver_production' if (target.name == 'production') else 'silver_staging' if (target.name == 'staging') else target.catalog }}"
      +schema: preparation

    marts:
      +materialized: table
      +catalog: "{{ 'gold_production' if (target.name == 'production') else 'gold_staging' if (target.name == 'staging') else target.catalog }}"
      +schema: marketing_spend

  # Elementary package models -> "elementary" schema in every environment.
  elementary:
    +meta:
      owner: "external_package"
    +catalog: "{{ 'silver_production' if (target.name == 'production') else 'silver_staging' if (target.name == 'staging') else target.catalog }}"
    +schema: "elementary"
    +enabled: "{{ target.name in ['production', 'staging'] | as_bool }}"
  
  dbt_project_evaluator:
    +meta:
      owner: "external_package"
    +schema: _evaluator
    # disable by default unless specifically enabled and prevent from running on production
    +enabled: "{{ (target.name not in ['production', 'staging'] | as_bool) and (env_var('ENABLE_DBT_PROJECT_EVALUATOR', 'false') | lower == 'true' | as_bool)  }}"

  
  
