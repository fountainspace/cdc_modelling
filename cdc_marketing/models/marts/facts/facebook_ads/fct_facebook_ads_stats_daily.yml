version: 2

models:
  - name: fct_facebook_ads_stats_daily
    description: "Facebook ad stats"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_id
            - ad_date

    #config:
    #  contract:
    #    enforced: true

    columns:
      - name: ad_id
        description: "{{ doc('ad_id') }}"
        data_type: string

      - name: ad_spend
        description: "{{ doc('ad_spend') }}"

      - name: ad_impressions
        description: "{{ doc('ad_impressions') }}"

      - name: ad_clicks
        description: "{{ doc('ad_clicks') }}"

      - name: ad_date
        description: "{{ doc('ad_date') }}"
