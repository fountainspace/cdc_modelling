version: 2

models:
  - name: stg_facebook_ads_account_history
    description: Facebook platform account model
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - account_id
            - account_updated_at
    columns:
      - name: account_id
        description: "{{ doc('account_id') }}"

      - name: account_name
        description: "{{ doc('account_name') }}"

      - name: ad_currency_code
        description: "{{ doc('ad_currency_code') }}"

      - name: account_created_at
        description: "{{ doc('account_created_at') }}"

      - name: account_updated_at
        description: "{{ doc('account_updated_at') }}"
