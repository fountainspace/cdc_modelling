version: 2

models:
  - name: stg_facebook_ads_ad_set_history
    description: Facebook ad set history
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_group_id
            - ad_group_updated_at
    columns:
      - name: ad_group_id
        description: "{{ doc('ad_group_id') }}"

      - name: ad_group_name
        description: "{{ doc('ad_group_name') }}"

      - name: ad_group_updated_at
        description: "{{ doc('ad_group_updated_at') }}"
