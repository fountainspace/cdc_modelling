sources:
  - name: snapchat_ads
    database: bronze_production
    description: data from snapchat platform
    schema: snapchat
    config:
      enabled: true
      meta:
        owner: "@cde_engineer"
      freshness:
        warn_after:
          count: 2
          period: day

    tables:
      - name: ad_geo_country_daily_report
        description: snapchat daily ads stats by geo
        identifier: snapchat_ads_stats
        columns:
          - name: ad_detail_id
            description: "{{ doc('ad_detail_id') }}"

          - name: ad_currency_code
            description: "{{ doc('ad_currency_code') }}"

          - name: ad_country
            description: "{{ doc('ad_country') }}"

          - name: ad_spend
            description: "{{ doc('ad_spend') }}"

          - name: ad_impressions
            description: "{{ doc('ad_impressions') }}"

          - name: ad_clicks
            description: "{{ doc('ad_clicks') }}"

          - name: ad_date
            description: "{{ doc('ad_date') }}"

          - name: data_src
            description: "{{ doc('data_src') }}"
