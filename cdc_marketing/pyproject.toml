[project]
name = "cdc-marketing"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbt-colibri==0.3.7",
    "dbt-databricks>=1.12.5",
    "elementary-data[databricks]>=0.26,<0.27",
    # dbt-colibri 0.3.7 needs Scope.union_scopes, removed in sqlglot 30.19 (UNION column lineage breaks)
    "sqlglot~=30.18.0",
]

[dependency-groups]
dev = [
    "diff-cover>=10.6.0",
    "sqlfluff>=4.4.0",
]
