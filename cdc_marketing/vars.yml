
vars:
  dbt_project_evaluator:
    models_fanout_threshold: 4 # max number of downstream dependencies for each model
    model_types: ["staging", "intermediate", "marts"]
    marts_prefixes: ["fct_", "dim_"]
    exclude_packages: ["elementary"]

  dev_limit: true

  # Elementary uploads only cdc_marketing nodes (models, sources, seeds, tests) so package
  # nodes such as dbt_project_evaluator's seed and tests don't show up in the report
  upload_only_current_project_artifacts: true
